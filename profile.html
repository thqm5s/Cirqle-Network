<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Founder Profile — Cirqle</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-color: #f4f4f2;
        --text-main: #080808;
        --glass-bg: rgba(255, 255, 255, 0.7);
      }
      body {
        font-family: "DM Sans", sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
      }
      nav {
        padding: 20px 5%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(244, 244, 242, 0.8);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 100;
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      }
      .logo {
        font-family: "Syne";
        font-weight: 800;
        font-size: 22px;
        text-transform: uppercase;
        text-decoration: none;
        color: #000;
      }

      .container {
        max-width: 800px;
        margin: 60px auto;
        padding: 0 5%;
      }
      .profile-card {
        background: var(--glass-bg);
        padding: 50px;
        border-radius: 40px;
        border: 1px solid #fff;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.03);
        text-align: center;
      }

      .avatar-lg {
        width: 120px;
        height: 120px;
        background: #000;
        color: #fff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        font-family: "Syne";
        margin: 0 auto 20px;
      }

      h1 {
        font-family: "Syne";
        font-size: 32px;
        text-transform: uppercase;
        margin-bottom: 5px;
      }
      .location {
        color: #666;
        font-size: 14px;
        margin-bottom: 30px;
        display: block;
      }

      .bio-section {
        text-align: left;
        margin-top: 40px;
      }
      .bio-section h3 {
        font-family: "Syne";
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #999;
        margin-bottom: 15px;
      }
      .bio-text {
        font-size: 18px;
        line-height: 1.6;
        color: #333;
      }

      .skills-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 15px;
      }
      .skill-tag {
        padding: 8px 16px;
        background: #eee;
        border-radius: 100px;
        font-size: 13px;
        font-weight: 600;
      }

      .edit-btn {
        margin-top: 40px;
        padding: 12px 25px;
        border-radius: 100px;
        border: 1px solid #000;
        background: transparent;
        cursor: pointer;
        font-weight: 700;
        transition: all 0.3s;
      }
      .edit-btn:hover {
        background: #000;
        color: #fff;
      }

      /* Modal simple pour l'édition */
      #edit-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        z-index: 1000;
        align-items: center;
        justify-content: center;
      }
      .modal-content {
        background: #fff;
        padding: 40px;
        border-radius: 30px;
        width: 90%;
        max-width: 500px;
      }
      input,
      textarea {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 10px;
        border: 1px solid #ddd;
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="dashboard.html" class="logo">Cirqle</a>
      <a
        href="dashboard.html"
        style="text-decoration: none; color: #666; font-size: 14px"
        >← Back</a
      >
    </nav>

    <div class="container">
      <div class="profile-card">
        <div class="avatar-lg" id="display-avatar">??</div>
        <h1 id="display-name">Founder Name</h1>
        <span class="location" id="display-location">City, Country</span>

        <div class="bio-section">
          <h3>About Me</h3>
          <p class="bio-text" id="display-bio">
            No bio added yet. Click edit to tell the community about your
            background.
          </p>
        </div>

        <div class="bio-section">
          <h3>Superpowers (Expertise)</h3>
          <div class="skills-grid" id="display-skills">
            <span class="skill-tag">Founder</span>
          </div>
        </div>

        <button class="edit-btn" onclick="openModal()">Edit Profile</button>
      </div>
    </div>

    <div id="edit-modal">
      <div class="modal-content">
        <h2 style="font-family: &quot;Syne&quot;; margin-bottom: 20px">
          Update Profile
        </h2>
        <input type="text" id="input-name" placeholder="Full Name" />
        <input
          type="text"
          id="input-location"
          placeholder="Location (ex: Paris, France)"
        />
        <textarea
          id="input-bio"
          placeholder="Short Bio"
          style="height: 100px"
        ></textarea>
        <input
          type="text"
          id="input-skills"
          placeholder="Skills (separated by commas)"
        />
        <button
          id="save-profile"
          style="
            width: 100%;
            padding: 15px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 100px;
            font-weight: 700;
            cursor: pointer;
          "
        >
          Save Changes
        </button>
        <button
          onclick="closeModal()"
          style="
            width: 100%;
            background: none;
            border: none;
            margin-top: 10px;
            color: #999;
            cursor: pointer;
          "
        >
          Cancel
        </button>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import {
        getFirestore,
        doc,
        getDoc,
        setDoc,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBzDVL-3tQgyfXOJqX5WvkYsEoBq4PBMzM",
        authDomain: "cirqle-2c3b2.firebaseapp.com",
        projectId: "cirqle-2c3b2",
        storageBucket: "cirqle-2c3b2.firebasestorage.app",
        messagingSenderId: "12313980360",
        appId: "1:12313980360:web:c262002952f3618bd464fd",
        measurementId: "G-WS5HN1X6B2",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // Pour cet exemple, on utilise un ID fixe "me".
      // Plus tard, avec l'Authentification, ce sera l'ID de l'utilisateur connecté.
      const userId = "me";

      async function loadProfile() {
        const docRef = doc(db, "users", userId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById("display-name").innerText =
            data.name || "Founder";
          document.getElementById("display-location").innerText =
            data.location || "Earth";
          document.getElementById("display-bio").innerText = data.bio || "";
          document.getElementById("display-avatar").innerText = (
            data.name || "F"
          )
            .substring(0, 2)
            .toUpperCase();

          if (data.skills) {
            const skillsArea = document.getElementById("display-skills");
            skillsArea.innerHTML = "";
            data.skills.split(",").forEach((s) => {
              skillsArea.innerHTML += `<span class="skill-tag">${s.trim()}</span>`;
            });
          }
        }
      }

      document
        .getElementById("save-profile")
        .addEventListener("click", async () => {
          const data = {
            name: document.getElementById("input-name").value,
            location: document.getElementById("input-location").value,
            bio: document.getElementById("input-bio").value,
            skills: document.getElementById("input-skills").value,
          };

          await setDoc(doc(db, "users", userId), data);
          location.reload();
        });

      window.openModal = () =>
        (document.getElementById("edit-modal").style.display = "flex");
      window.closeModal = () =>
        (document.getElementById("edit-modal").style.display = "none");

      loadProfile();
    </script>
  </body>
</html>
