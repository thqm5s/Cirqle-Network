<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join Cirqle</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f4f4f2;
        --text: #080808;
      }
      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      .auth-card {
        background: white;
        padding: 40px;
        border-radius: 32px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
        text-align: center;
      }
      h1 {
        font-family: "Syne";
        text-transform: uppercase;
        font-size: 24px;
        margin-bottom: 30px;
      }
      input {
        width: 100%;
        padding: 15px;
        margin-bottom: 15px;
        border-radius: 12px;
        border: 1px solid #ddd;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 15px;
        border-radius: 100px;
        border: none;
        background: #000;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        margin-bottom: 15px;
      }
      .toggle-link {
        font-size: 14px;
        color: #666;
        cursor: pointer;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="auth-card">
      <h1 id="auth-title">Welcome to Cirqle</h1>
      <input type="email" id="email" placeholder="Email address" />
      <input
        type="password"
        id="password"
        placeholder="Password (min 6 chars)"
      />
      <button id="auth-btn">Create Account</button>
      <p class="toggle-link" id="toggle-auth">
        Already have an account? Log in
      </p>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import {
        getAuth,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
      import {
        getFirestore,
        doc,
        setDoc,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBzDVL-3tQgyfXOJqX5WvkYsEoBq4PBMzM",
        authDomain: "cirqle-2c3b2.firebaseapp.com",
        projectId: "cirqle-2c3b2",
        storageBucket: "cirqle-2c3b2.firebasestorage.app",
        messagingSenderId: "12313980360",
        appId: "1:12313980360:web:c262002952f3618bd464fd",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      let isLogin = false;

      document.getElementById("toggle-auth").addEventListener("click", () => {
        isLogin = !isLogin;
        document.getElementById("auth-title").innerText = isLogin
          ? "Login to Cirqle"
          : "Welcome to Cirqle";
        document.getElementById("auth-btn").innerText = isLogin
          ? "Login"
          : "Create Account";
        document.getElementById("toggle-auth").innerText = isLogin
          ? "New here? Create an account"
          : "Already have an account? Log in";
      });

      document
        .getElementById("auth-btn")
        .addEventListener("click", async () => {
          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          if (!email || !password) {
            alert("Please fill in all fields");
            return;
          }

          try {
            if (isLogin) {
              await signInWithEmailAndPassword(auth, email, password);
              window.location.href = "dashboard.html";
            } else {
              // --- ÉTAPE 1 : INFORMATION PRIX ---
              const userAgrees = confirm(
                "Membership to Cirqle costs [Ton Prix] and is required to access the community. Do you want to proceed to payment?",
              );

              if (!userAgrees) return;

              // --- ÉTAPE 2 : CRÉATION DU COMPTE ---
              const userCredential = await createUserWithEmailAndPassword(
                auth,
                email,
                password,
              );
              const user = userCredential.user;

              // On crée le profil. isApproved est true d'office car le filtre est désormais le paiement.
              await setDoc(doc(db, "users", user.uid), {
                email: user.email,
                isApproved: true,
                hasPaid: false, // Sera passé en true manuellement par toi après confirmation Stripe
                role: "member",
                createdAt: new Date(),
              });

              // --- ÉTAPE 3 : REDIRECTION STRIPE IMMÉDIATE ---
              window.location.href =
                "https://buy.stripe.com/test_dRmaEWgVuaVzeE1bGU5Rm00";
            }
          } catch (error) {
            alert("Error: " + error.message);
          }
        });
    </script>
  </body>
</html>
